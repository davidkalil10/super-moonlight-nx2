[package]
name = "moonlight-rust-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
allocator-proof = []

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
debug = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
