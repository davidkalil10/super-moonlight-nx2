[workspace]
members = ["core", "runtime", "host", "io", "ui", "app", "secure"]
default-members = ["core", "runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "abort"
codegen-units = 1
debug = 1
