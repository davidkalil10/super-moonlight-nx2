[workspace]
members = ["core", "runtime", "host", "io", "ui", "app", "secure", "sunshine", "tsnx-core", "tsnx-ffi"]
default-members = ["core", "runtime"]
exclude = ["third_party"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
tsnx-core = { path = "tsnx-core", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
blake2 = { version = "0.10", default-features = false }
hex-literal = "0.4"
rustls = { version = "0.23.45", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.9", default-features = false }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
zerocopy = { version = "0.8", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-icmp", "auto-icmp-echo-reply"] }
log = { version = "0.4", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
panic = "abort"
codegen-units = 1
debug = 1
