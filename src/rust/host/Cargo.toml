[package]
name = "moonlight-nx2-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
upstream-worker = []

[[bin]]
name = "moonlight-nx2-upstream-worker"
path = "src/upstream_worker/main.rs"
required-features = ["upstream-worker"]

[dependencies]
moonlight-nx2-core = { path = "../core" }
moonlight-nx2-secure = { path = "../secure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
subtle = "2.6"

[lints]
workspace = true
