[package]
name = "moonlight-nx2-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
diagnostic-renderer = []
diagnostic-display = ["diagnostic-renderer"]
diagnostic-display120 = ["diagnostic-display"]
diagnostic-coexist = ["diagnostic-renderer"]
diagnostic-io = []
diagnostic-audio-cue = []
diagnostic-udp = []
diagnostic-nvdec = []
diagnostic-sdk-backing = []
diagnostic-ui = []
diagnostic-ui-order = ["diagnostic-ui"]
diagnostic-ui-data = ["diagnostic-ui"]
diagnostic-ui-alpha = ["diagnostic-ui-data"]
diagnostic-ui-text = ["diagnostic-ui-data"]
diagnostic-ui-text-apps = ["diagnostic-ui-text"]
diagnostic-ui-text-overlay = ["diagnostic-ui-text"]
diagnostic-ui-text-interactive = ["diagnostic-ui"]
diagnostic-control = []
diagnostic-control-default = ["diagnostic-control"]
frontend = []
diagnostic-frontend = ["frontend"]
diagnostic-frontend-check = ["frontend"]
diagnostic-ref-replay = ["diagnostic-frontend"]
native-video = []
diagnostic-native-decode = ["diagnostic-ref-replay", "native-video"]
sdk-video = []
diagnostic-sdk-decode = ["diagnostic-ref-replay", "sdk-video"]
host-renderer = []

[dependencies]
moonlight-nx2-core = { path = "../core" }
moonlight-nx2-io = { path = "../io" }
moonlight-nx2-app = { path = "../app" }
moonlight-nx2-ui = { path = "../ui" }
ash = { git = "ssh://git@github.com/ash-rs/ash.git", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16", default-features = false }

[lints]
workspace = true
