[package]
name = "moonlight-nx2-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
frontend = []
diagnostic-sdk-decode = ["frontend"]
diagnostic-sdk-modes = ["diagnostic-sdk-decode"]
sdk-video-120-decode = ["frontend"]
video-tcp = []
ui-pattern = ["frontend"]
# Holds the GPU about half a second for each page it checks.
ui-page-check = ["ui-pattern"]
ui-uncached = ["ui-pattern"]
# Reads one shown frame back from uncached memory, 25 to 100 ms, to log its detail.
frame-detail = ["frontend"]
host-renderer = []

[dependencies]
moonlight-nx2-core = { path = "../core" }
moonlight-nx2-io = { path = "../io" }
moonlight-nx2-app = { path = "../app" }
moonlight-nx2-ui = { path = "../ui" }
tsnx-ffi = { path = "../tsnx-ffi" }
ash = { git = "https://github.com/ash-rs/ash.git", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16", default-features = false }

[lints]
workspace = true
